name: defiwawa
description: "DefiWawa: Warsaw AED map for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

workspace:
  - packages/design_system

dependencies:
  flutter:
    sdk: flutter
  design_system: any
  flutter_hooks: ^0.21.3+1
  go_router: ^18.1.0
  hooks_riverpod: ^3.4.3
  mapbox_maps_flutter: ^2.22.0
  flutter_svg: ^2.3.0
  geolocator: ^14.1.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  clipper2: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

# App icon: the green D of the web favicon on white (assets/launcher/app-icon.svg → .png).
# Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/launcher/app-icon.png
  ios: true
  remove_alpha_ios: true
  android: true
