name: refresh-aed

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours; use "0 3 * * *" for once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AED snapshot
        working-directory: backend
        env:
          WARSAW_API_KEY: ${{ secrets.WARSAW_API_KEY }}
        run: python -m pipeline.fetch_aed
      - name: Build aed.json (regex first, LLM only for new strings)
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python -m pipeline.build
      - name: Commit changes
        run: |
          git config user.name "aed-refresh-bot"
          git config user.email "aed-refresh-bot@users.noreply.github.com"
          git add data/raw data/out data/cache
          git diff --cached --quiet || git commit -m "data: refresh AED snapshot"
          git push
